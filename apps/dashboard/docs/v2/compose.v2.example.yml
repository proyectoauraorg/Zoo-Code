# ZooDash v2 — infra local (PLANTILLA, no ejecutar aún).
# Compose PROPIO de ZooDash. Puertos host desplazados para NO chocar con la malla de
# ZordonOS (que ya usa nats:4222, etc.). Copiar a la raíz como compose.v2.yml cuando se ejecute v2.
#
#   docker compose -f compose.v2.yml up -d
#   # .env.local (v2):  DB_DRIVER=postgres
#   #   DATABASE_URL=postgres://zoodash:zoodash@localhost:5433/zoodash
#   #   REDIS_URL=redis://localhost:6380
#   #   NATS_URL=nats://localhost:4223
#   #   GITHUB_WEBHOOK_SECRET=...   (HMAC; no commitear)

name: zoodash-v2

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16   # Postgres 16 + TimescaleDB
    environment:
      POSTGRES_USER: zoodash
      POSTGRES_PASSWORD: zoodash
      POSTGRES_DB: zoodash
    ports:
      - "5433:5432"                              # host 5433 (evita 5432 si hay otro PG)
    volumes:
      - zoodash_pg:/var/lib/postgresql/data
      # esquema inicial (se monta para `docker-entrypoint-initdb.d`):
      - ./docs/v2/DATA_MODEL_v2.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoodash"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # cache + pub/sub, sin persistencia
    ports:
      - "6380:6379"                              # host 6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8223"]               # JetStream + monitoring
    ports:
      - "4223:4222"                              # host 4223 (la de ZordonOS sigue en 4222)
      - "8223:8222"                              # monitoring HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # El projector vive como proceso durable (ADR-9). Imagen de ejemplo; el código llega en V2.0.
  # projector:
  #   build: ./services/projector
  #   environment:
  #     DATABASE_URL: postgres://zoodash:zoodash@postgres:5432/zoodash
  #     REDIS_URL: redis://redis:6379
  #     NATS_URL: nats://nats:4222
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #     nats: { condition: service_healthy }

volumes:
  zoodash_pg:
